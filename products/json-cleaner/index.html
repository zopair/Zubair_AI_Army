<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOPAIR JSON Cleaner</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:24px}textarea{width:100%;min-height:300px;font-family:monospace}button{padding:10px 14px;margin:6px 6px 6px 0}#out{white-space:pre-wrap;background:#f5f5f5;padding:14px}</style></head><body><h1>JSON Cleaner</h1><p>Paste JSON, validate it, normalize whitespace, and download the cleaned result. Runs entirely in your browser.</p><textarea id="src" placeholder='{"hello":"world"}'></textarea><br><button id="clean">Clean & Validate</button><button id="download">Download</button><pre id="out"></pre><script>let cleaned='';const src=document.querySelector('#src'),out=document.querySelector('#out');document.querySelector('#clean').onclick=()=>{try{cleaned=JSON.stringify(JSON.parse(src.value),null,2);out.textContent='Valid JSON ✓\n\n'+cleaned}catch(e){cleaned='';out.textContent='Invalid JSON: '+e.message}};document.querySelector('#download').onclick=()=>{if(!cleaned)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([cleaned],{type:'application/json'}));a.download='cleaned.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></body></html>
