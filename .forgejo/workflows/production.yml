name: ZOPAIR Production Verification

on:
  push:
    branches: [feat/zopair-army-core, main]
  pull_request:

jobs:
  verify:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Prisma validation
        run: npx prisma validate
      - name: Revenue closure gate
        run: node infra/revenue/e2e/closure-gate.mjs
