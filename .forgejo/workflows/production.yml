name: ZOPAIR Production Verification

on:
  push:
    branches: [feat/zopair-army-core, main]
  pull_request:

jobs:
  verify:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Module smoke tests
        run: |
          node infra/fabric/execution/task-runner.test.mjs
          node infra/fabric/execution/provider-registry.test.mjs
          node infra/fabric/execution/orchestrator.test.mjs
          node infra/revenue/e2e/closure-gate.mjs
          node platform/product-registry.test.mjs
      - name: Prisma validation
        run: npx prisma validate
