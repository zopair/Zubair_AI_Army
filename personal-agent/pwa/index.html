<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>المساعد الشخصي</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,620px)}h1{font-size:25px;margin-bottom:6px}.muted{color:#94a3b8}.panel{background:#111c2e;border:1px solid #263449;border-radius:18px;padding:18px;margin-top:18px}textarea,input{width:100%;border:1px solid #334155;border-radius:12px;background:#0b1220;color:white;padding:14px;font:inherit}textarea{min-height:130px;resize:vertical}button{border:0;border-radius:12px;padding:13px 18px;background:#2563eb;color:white;font:inherit;font-weight:700;width:100%;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#bfdbfe}
  </style>
</head>
<body><main class="app"><h1>مساعدك الشخصي الذكي</h1><div class="muted">واجهة أولية لإرسال المهام ومتابعتها</div><section class="panel"><label for="endpoint">عنوان Worker</label><input id="endpoint" placeholder="https://your-worker.workers.dev"/><label for="token">مفتاح الوصول الشخصي</label><input id="token" type="password" autocomplete="off" placeholder="Bearer token"/><label for="task">ما المهمة التي تريد تنفيذها؟</label><textarea id="task" placeholder="اكتب طلبك هنا..."></textarea><button id="send">إرسال المهمة</button><pre id="status" aria-live="polite"></pre></section><script>
const $=id=>document.getElementById(id);$('send').onclick=async()=>{const base=$('endpoint').value.trim().replace(/\/$/,''),token=$('token').value,task=$('task').value.trim();if(!base||!token||!task){$('status').textContent='أكمل عنوان Worker ومفتاح الوصول والطلب.';return} $('send').disabled=true;$('status').textContent='جارٍ إرسال المهمة...';try{const r=await fetch(base+'/api/tasks',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({task})});const d=await r.json();$('status').textContent=JSON.stringify(d,null,2);if(d.task_id){const poll=async()=>{const q=await fetch(base+'/api/tasks/'+d.task_id,{headers:{authorization:'Bearer '+token}});const x=await q.json();$('status').textContent=JSON.stringify(x,null,2);if(['queued','dispatched','running'].includes(x.status))setTimeout(poll,5000)};setTimeout(poll,5000)}}catch(e){$('status').textContent='تعذر الاتصال: '+e.message}finally{$('send').disabled=false}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></main></body></html>
