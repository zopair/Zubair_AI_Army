name: Agent Referral Smoke

on:
  push:
    paths:
      - 'revenue/agent_referrals/**'
      - '.github/workflows/agent-referral-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node revenue/agent_referrals/referral_engine.test.mjs
