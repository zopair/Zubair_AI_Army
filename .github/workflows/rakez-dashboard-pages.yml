name: Deploy Rakez Dashboard Preview

on:
  push:
    branches: [main]
    paths:
      - "sample-3-rakez-performance-command-center/**"
      - ".github/workflows/rakez-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rakez-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: sample-3-rakez-performance-command-center

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
