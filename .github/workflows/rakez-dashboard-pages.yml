name: Deploy Rakez Dashboard Preview

on:
  push:
    branches: [main]
    paths:
      - "sample-2-arabic-first/**"
      - "sample-3-rakez-performance-command-center/**"
      - ".github/workflows/rakez-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble isolated previews
        run: |
          rm -rf _site
          mkdir -p _site/rakez
          cp -a sample-2-arabic-first/. _site/
          cp -a sample-3-rakez-performance-command-center/. _site/rakez/

      - name: Upload portfolio preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
