name: Zubair AI Army CI

on:
  push:
    branches: [main]
    paths:
      - "personal-agent/worker/**"
      - "v4_elite_builder/**"
      - "v1_production/**"
      - "scripts/ci/**"
      - "ARCHITECTURE.md"
      - "app/**"
      - "infra/fabric/**"
      - "platform/**"
      - "revenue/**"
      - "marketplace/**"
      - "prisma/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "personal-agent/worker/**"
      - "v4_elite_builder/**"
      - "v1_production/**"
      - "scripts/ci/**"
      - "ARCHITECTURE.md"
      - "app/**"
      - "infra/fabric/**"
      - "platform/**"
      - "revenue/**"
      - "marketplace/**"
      - "prisma/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: zopair-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: personal-agent/worker
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Test worker routes, auth, and executor
        run: npm test
      - name: Validate D1 migrations
        run: python -m unittest discover -s tests -v

  v4-application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v4_elite_builder
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run dependency-free contract tests
        run: node --test tests/*.test.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build production app
        run: npm run build

  repository-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate JSON manifests and compile Python sources
        run: python scripts/ci/preflight.py
  commercial-mvp:
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run product, revenue, and execution tests
        run: npm test
      - name: Type-check application
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
