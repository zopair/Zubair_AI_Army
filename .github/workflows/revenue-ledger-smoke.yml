name: Revenue Ledger Smoke

on:
  push:
    paths:
      - 'revenue/ledger/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/revenue-ledger-smoke.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node revenue/ledger/settlement.test.mjs
