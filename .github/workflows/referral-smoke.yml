name: Agent Referral Smoke

on:
  push:
    paths:
      - 'revenue/agent_sales/**'
      - '.github/workflows/referral-smoke.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node revenue/agent_sales/referral_flow.test.mjs
