name: Self Hosted Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    # Enable only after a private, isolated runner labeled `zopair-ci` is registered.
    runs-on: [self-hosted, linux, zopair-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node platform/factory/product-score.test.mjs
      - run: node platform/revenue-mvp/api_meter.test.mjs
      - run: node revenue/agent_sales/referral_flow.test.mjs
      - run: node revenue/ledger/settlement.test.mjs
