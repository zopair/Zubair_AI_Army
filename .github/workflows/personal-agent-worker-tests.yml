name: Personal Agent Worker Tests

on:
  pull_request:
    paths:
      - "personal-agent/worker/**"
      - "scripts/ci/preflight_worker_config.py"
      - ".github/workflows/personal-agent-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "personal-agent/worker/**"
      - ".github/workflows/personal-agent-worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: personal-agent/worker
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate Worker configuration template
        run: python ../../scripts/ci/preflight_worker_config.py --allow-placeholders
      - name: Validate D1 migration with SQLite
        run: python -m unittest discover -s tests -v
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run dependency-free auth tests
        run: npm test
