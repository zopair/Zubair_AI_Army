name: Personal Agent Worker Tests

on:
  pull_request:
    paths:
      - "personal-agent/worker/**"
      - ".github/workflows/personal-agent-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "personal-agent/worker/**"
      - ".github/workflows/personal-agent-worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: personal-agent/worker
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run dependency-free auth tests
        run: npm test
