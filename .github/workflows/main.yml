
name: Al-Zubair Sovereign Engine
on:
  push:
    branches: [ master ]
  schedule:
    - cron: '*/15 * * * *' # يعمل كل 15 دقيقة
  workflow_dispatch:

jobs:
  execute_all_agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests google-generativeai
      - name: Run Sovereign Core
        env:
          # هنا يتم حقن الصلاحيات لكل الملفات
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python app.py  # تشغيل العقل
          # يمكنك هنا إضافة تشغيل أي وكيل آخر وسيقرأ نفس المفاتيح
