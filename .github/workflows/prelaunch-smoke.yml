name: Prelaunch Campaign Smoke

on:
  push:
    paths:
      - 'marketing/prelaunch/**'
      - '.github/workflows/prelaunch-smoke.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node marketing/prelaunch/campaign.test.mjs
